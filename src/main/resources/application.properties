spring.application.name=indice-erp-api
app.entitlements.shadow-enabled=${APP_ENTITLEMENTS_SHADOW_ENABLED:true}
# Global emergency switch. It must remain false until one reviewed company is
# deliberately moved from SHADOW to ENFORCE in company_entitlement_policies.
app.entitlements.enforcement-enabled=${APP_ENTITLEMENTS_ENFORCEMENT_ENABLED:false}
app.entitlements.projection-enabled=${APP_ENTITLEMENTS_PROJECTION_ENABLED:true}
app.entitlements.projection-delay-ms=${APP_ENTITLEMENTS_PROJECTION_DELAY_MS:60000}
app.entitlements.projection-batch-size=${APP_ENTITLEMENTS_PROJECTION_BATCH_SIZE:100}

# Premium billing phase 2. Stripe remains test-only and disabled until the
# commercial Prices and launch cohort are approved explicitly.
app.billing.stripe.enabled=${APP_BILLING_STRIPE_ENABLED:false}
app.billing.stripe.mode=${APP_BILLING_STRIPE_MODE:test}
app.billing.stripe.secret-key=${APP_BILLING_STRIPE_SECRET_KEY:${STRIPE_SECRET_KEY:}}
app.billing.stripe.secret-key-file=${APP_BILLING_STRIPE_SECRET_KEY_FILE:}
app.billing.stripe.webhook-secret=${APP_BILLING_STRIPE_WEBHOOK_SECRET:${STRIPE_WEBHOOK_SECRET:}}
app.billing.stripe.webhook-secret-file=${APP_BILLING_STRIPE_WEBHOOK_SECRET_FILE:}
app.billing.stripe.success-url=${APP_BILLING_STRIPE_SUCCESS_URL:${STRIPE_SIGNUP_SUCCESS_URL:${app.web.public-url}/signup/complete?session_id={CHECKOUT_SESSION_ID}}}
app.billing.stripe.cancel-url=${APP_BILLING_STRIPE_CANCEL_URL:${STRIPE_SIGNUP_CANCEL_URL:${app.web.public-url}/signup}}
app.billing.stripe.portal-return-url=${APP_BILLING_STRIPE_PORTAL_RETURN_URL:${STRIPE_PORTAL_RETURN_URL:${app.web.public-url}/billing}}
app.billing.stripe.automatic-tax-enabled=${APP_BILLING_STRIPE_AUTOMATIC_TAX_ENABLED:${STRIPE_AUTOMATIC_TAX_ENABLED:true}}
app.billing.stripe.tax-id-collection-enabled=${APP_BILLING_STRIPE_TAX_ID_COLLECTION_ENABLED:${STRIPE_TAX_ID_COLLECTION_ENABLED:true}}
app.billing.stripe.price-basic-1-monthly=${APP_BILLING_STRIPE_PRICE_BASIC_1_MONTHLY:${STRIPE_PRICE_ONE_MODULE:}}
app.billing.stripe.price-basic-1-annual=${APP_BILLING_STRIPE_PRICE_BASIC_1_ANNUAL:}
app.billing.stripe.price-basic-2-monthly=${APP_BILLING_STRIPE_PRICE_BASIC_2_MONTHLY:${STRIPE_PRICE_TWO_MODULES:}}
app.billing.stripe.price-basic-2-annual=${APP_BILLING_STRIPE_PRICE_BASIC_2_ANNUAL:}
app.billing.stripe.price-basic-3-monthly=${APP_BILLING_STRIPE_PRICE_BASIC_3_MONTHLY:}
app.billing.stripe.price-basic-3-annual=${APP_BILLING_STRIPE_PRICE_BASIC_3_ANNUAL:}
app.billing.stripe.price-basic-all-monthly=${APP_BILLING_STRIPE_PRICE_BASIC_ALL_MONTHLY:${STRIPE_PRICE_ALL_BASIC_MODULES:}}
app.billing.stripe.price-basic-all-annual=${APP_BILLING_STRIPE_PRICE_BASIC_ALL_ANNUAL:}
app.billing.stripe.price-extra-seat-monthly=${APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_MONTHLY:${STRIPE_PRICE_EXTRA_COLLABORATOR:}}
app.billing.stripe.price-extra-seat-annual=${APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_ANNUAL:}
app.billing.stripe.price-storage-block-monthly=${APP_BILLING_STRIPE_PRICE_STORAGE_BLOCK_MONTHLY:}
app.billing.stripe.price-storage-block-annual=${APP_BILLING_STRIPE_PRICE_STORAGE_BLOCK_ANNUAL:}
app.billing.stripe.processor-enabled=${APP_BILLING_STRIPE_PROCESSOR_ENABLED:false}
app.billing.stripe.processor-delay-ms=${APP_BILLING_STRIPE_PROCESSOR_DELAY_MS:5000}
app.billing.stripe.processor-batch-size=${APP_BILLING_STRIPE_PROCESSOR_BATCH_SIZE:25}
app.billing.stripe.processor-max-attempts=${APP_BILLING_STRIPE_PROCESSOR_MAX_ATTEMPTS:12}
app.billing.stripe.processor-lease-seconds=${APP_BILLING_STRIPE_PROCESSOR_LEASE_SECONDS:120}
app.billing.stripe.payload-retention-days=${APP_BILLING_STRIPE_PAYLOAD_RETENTION_DAYS:90}
app.billing.provisioning.enabled=${APP_BILLING_PROVISIONING_ENABLED:false}
app.billing.provisioning.reconciliation-batch-size=${APP_BILLING_PROVISIONING_RECONCILIATION_BATCH_SIZE:25}
# Commercial enforcement is an independent launch switch. Leave both flags
# false until Stripe webhook reconciliation has been validated for a cohort.
app.billing.lifecycle.enabled=${APP_BILLING_LIFECYCLE_ENABLED:false}
app.billing.lifecycle.scheduler-enabled=${APP_BILLING_LIFECYCLE_SCHEDULER_ENABLED:false}
app.billing.lifecycle.grace-days=${APP_BILLING_LIFECYCLE_GRACE_DAYS:14}
app.billing.lifecycle.read-only-days=${APP_BILLING_LIFECYCLE_READ_ONLY_DAYS:14}
app.billing.lifecycle.retention-days=${APP_BILLING_LIFECYCLE_RETENTION_DAYS:90}
app.billing.lifecycle.scheduler-delay-ms=${APP_BILLING_LIFECYCLE_SCHEDULER_DELAY_MS:60000}
app.billing.lifecycle.scheduler-batch-size=${APP_BILLING_LIFECYCLE_SCHEDULER_BATCH_SIZE:100}

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8082}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${APP_SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.timeout=${APP_SESSION_TIMEOUT:12h}
kiosk.employee-center.enabled=${KIOSK_EMPLOYEE_CENTER_ENABLED:false}
app.kiosk.employee-center.inactivity-timeout-seconds=${KIOSK_EMPLOYEE_CENTER_INACTIVITY_TIMEOUT_SECONDS:28800}
app.kiosk.multi.inactivity-timeout-seconds=${KIOSK_MULTI_INACTIVITY_TIMEOUT_SECONDS:28800}
app.kiosk.multi.session-ttl-seconds=${KIOSK_MULTI_SESSION_TTL_SECONDS:43200}
server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/indice_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:indice_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:indice_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

app.web.allowed-origins=${APP_WEB_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000}
app.web.public-url=${APP_WEB_PUBLIC_URL:}
app.web.invitation-base-url=${APP_WEB_INVITATION_BASE_URL:${app.web.public-url}}
app.web.password-reset-base-url=${APP_WEB_PASSWORD_RESET_BASE_URL:${app.web.public-url}}
app.hr.attendance.kiosk.pin-failure-limit=${APP_HR_ATTENDANCE_KIOSK_PIN_FAILURE_LIMIT:30}
app.hr.attendance.kiosk.pin-attempt-window-minutes=${APP_HR_ATTENDANCE_KIOSK_PIN_ATTEMPT_WINDOW_MINUTES:5}
app.hr.attendance.kiosk.pin-lock-minutes=${APP_HR_ATTENDANCE_KIOSK_PIN_LOCK_MINUTES:1}
app.billing.signup.internal-trial-enabled=${APP_BILLING_SIGNUP_INTERNAL_TRIAL_ENABLED:false}
app.billing.stripe.price-one-module=${STRIPE_PRICE_ONE_MODULE:}
app.billing.stripe.price-two-modules=${STRIPE_PRICE_TWO_MODULES:}
app.billing.stripe.price-additional-module=${STRIPE_PRICE_ADDITIONAL_MODULE:}
app.billing.stripe.price-all-basic-modules=${STRIPE_PRICE_ALL_BASIC_MODULES:}
app.billing.stripe.price-extra-collaborator=${STRIPE_PRICE_EXTRA_COLLABORATOR:}
app.billing.stripe.payment-failure-grace-days=${STRIPE_PAYMENT_FAILURE_GRACE_DAYS:0}
app.email.enabled=${APP_EMAIL_ENABLED:true}
app.email.provider=${APP_EMAIL_PROVIDER:sendgrid}
app.email.from=${APP_EMAIL_FROM:${APP_EMAIL_FROM_ADDRESS:no-reply@indice.local}}
app.email.from-name=${APP_EMAIL_FROM_NAME:Indice ERP}
app.email.reply-to=${APP_EMAIL_REPLY_TO:}
app.email.sendgrid.api-key=${APP_EMAIL_SENDGRID_API_KEY:}
app.consulting.team-email=${APP_CONSULTING_TEAM_EMAIL:consultoria@indiceapp.com}
app.consulting.additional-session-amount-cents=${APP_CONSULTING_ADDITIONAL_SESSION_AMOUNT_CENTS:8900}
app.storage.provider=${APP_STORAGE_PROVIDER:none}
app.storage.required=${APP_STORAGE_REQUIRED:false}
app.storage.minio.endpoint=${APP_STORAGE_MINIO_ENDPOINT:http://127.0.0.1:9000}
app.storage.minio.public-endpoint=${APP_STORAGE_MINIO_PUBLIC_ENDPOINT:${APP_STORAGE_MINIO_ENDPOINT:http://127.0.0.1:9000}}
app.storage.minio.service-public-endpoint=${APP_STORAGE_MINIO_SERVICE_PUBLIC_ENDPOINT:${APP_STORAGE_MINIO_PUBLIC_ENDPOINT:${APP_STORAGE_MINIO_ENDPOINT:http://127.0.0.1:9000}}}
app.storage.minio.access-key=${APP_STORAGE_MINIO_ACCESS_KEY:minioadmin}
app.storage.minio.secret-key=${APP_STORAGE_MINIO_SECRET_KEY:minioadmin}
app.storage.minio.region=${APP_STORAGE_MINIO_REGION:us-east-1}
app.storage.minio.bucket-attendance=${APP_STORAGE_MINIO_BUCKET_ATTENDANCE:indice-hr-attendance}
app.storage.minio.bucket-biometric=${APP_STORAGE_MINIO_BUCKET_BIOMETRIC:indice-hr-biometric}
app.storage.minio.bucket-documents=${APP_STORAGE_MINIO_BUCKET_DOCUMENTS:indice-hr-documents}
app.storage.minio.bucket-sales-documents=${APP_STORAGE_MINIO_BUCKET_SALES_DOCUMENTS:indice-sales-documents}
app.storage.minio.presign-expiry-seconds=${APP_STORAGE_MINIO_PRESIGN_EXPIRY_SECONDS:900}
app.billing.storage.enforcement-enabled=${APP_BILLING_STORAGE_ENFORCEMENT_ENABLED:false}
app.billing.storage.included-bytes=${APP_BILLING_STORAGE_INCLUDED_BYTES:5368709120}
app.billing.storage.block-bytes=${APP_BILLING_STORAGE_BLOCK_BYTES:1073741824}
app.billing.storage.reservation-ttl-minutes=${APP_BILLING_STORAGE_RESERVATION_TTL_MINUTES:30}
app.billing.storage.cleanup-batch-size=${APP_BILLING_STORAGE_CLEANUP_BATCH_SIZE:200}
app.billing.storage.cleanup-delay-ms=${APP_BILLING_STORAGE_CLEANUP_DELAY_MS:300000}
app.exchange.banxico-token=${APP_EXCHANGE_BANXICO_TOKEN:}
app.exchange.request-timeout-ms=${APP_EXCHANGE_REQUEST_TIMEOUT_MS:7000}

app.hr.attendance.enforce-location-radius=${APP_HR_ATTENDANCE_ENFORCE_LOCATION_RADIUS:false}
app.hr.kiosk.identification-token-secret=${APP_HR_KIOSK_IDENTIFICATION_TOKEN_SECRET:indice-kiosk-identification-secret}
app.kiosk.token-protection-secret=${APP_KIOSK_TOKEN_PROTECTION_SECRET:indice-local-kiosk-protection-secret-2026}
app.hr.kiosk.identification-token-ttl-seconds=${APP_HR_KIOSK_IDENTIFICATION_TOKEN_TTL_SECONDS:120}
app.hr.kiosk.inactivity-timeout-seconds=${APP_HR_KIOSK_INACTIVITY_TIMEOUT_SECONDS:60}
app.hr.face.enabled=${APP_HR_FACE_ENABLED:false}
app.hr.face.service-base-url=${APP_HR_FACE_SERVICE_BASE_URL:http://127.0.0.1:8091}
app.hr.face.session-expiry-seconds=${APP_HR_FACE_SESSION_EXPIRY_SECONDS:600}

# Transitional Flyway setup for the existing shared legacy schema.
# The first migrate on a non-empty schema will create flyway_schema_history
# and tag the current database at baseline version 0 without replaying DDL.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Legacy shared schema baseline
spring.flyway.clean-disabled=true
# Allow the repo to fold early experimental migrations back into the base SQL files
# without breaking older local databases that already recorded those versions.
spring.flyway.ignore-migration-patterns=*:missing
spring.flyway.validate-on-migrate=true

spring.sql.init.mode=never
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

logging.file.path=${APP_LOG_DIR:logs}
logging.level.root=${APP_LOG_LEVEL_ROOT:INFO}
logging.level.com.indice.erp=${APP_LOG_LEVEL_APP:INFO}
logging.level.org.flywaydb=${APP_LOG_LEVEL_FLYWAY:INFO}
logging.level.com.zaxxer.hikari=${APP_LOG_LEVEL_HIKARI:INFO}
logging.level.org.springframework.web=${APP_LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.springframework.jdbc.core=${APP_LOG_LEVEL_JDBC:INFO}
