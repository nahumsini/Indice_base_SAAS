spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/indice_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${TEST_DATASOURCE_USERNAME:indice_test_user}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD:indice_test_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Cached Spring test contexts must not exhaust a standard MySQL connection limit.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Legacy shared schema baseline
spring.flyway.clean-disabled=true
spring.flyway.ignore-migration-patterns=*:missing
spring.flyway.validate-on-migrate=true

spring.sql.init.mode=never
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

app.email.enabled=false
app.storage.provider=none
app.hr.kiosk.identification-token-secret=indice-test-only-hr-kiosk-identification-token-secret
app.kiosk.token-protection-secret=indice-test-only-kiosk-token-protection-secret
app.kiosk.secret-protection.enabled=false
