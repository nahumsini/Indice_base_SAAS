name: indice-apptest

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    network_mode: host
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --bind-address=127.0.0.1
      - --port=8336
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 8336 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    network_mode: host
    restart: unless-stopped
    command: server /data --address "127.0.0.1:8900" --console-address "127.0.0.1:8901"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS:-https://apptest.indiceapp.com}
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:8900
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    network_mode: host
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://127.0.0.1:8900
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_ATTENDANCE: ${MINIO_BUCKET_ATTENDANCE:-indice-hr-attendance}
      MINIO_BUCKET_BIOMETRIC: ${MINIO_BUCKET_BIOMETRIC:-indice-hr-biometric}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-indice-hr-documents}
      MINIO_BUCKET_SALES_DOCUMENTS: ${MINIO_BUCKET_SALES_DOCUMENTS:-indice-sales-documents}
      MINIO_CORS_FILE: /init/attendance-cors.xml
    volumes:
      - ../docker/minio/init-minio.sh:/init/init-minio.sh:ro
      - ../../ops/minio/attendance-cors.xml:/init/attendance-cors.xml:ro
    entrypoint: ["/bin/sh", "/init/init-minio.sh"]

  backend:
    image: indice-erp-backend:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    network_mode: host
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: 8182
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:8336/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_WEB_ALLOWED_ORIGINS: https://apptest.indiceapp.com
      APP_WEB_PUBLIC_URL: https://apptest.indiceapp.com
      APP_WEB_BASE_URL: https://apptest.indiceapp.com
      APP_WEB_INVITATION_BASE_URL: https://apptest.indiceapp.com
      APP_WEB_PASSWORD_RESET_BASE_URL: https://apptest.indiceapp.com
      APP_SESSION_COOKIE_SECURE: "true"
      APP_SESSION_COOKIE_SAME_SITE: lax
      APP_SESSION_TIMEOUT: 12h
      APP_STORAGE_PROVIDER: minio
      APP_STORAGE_REQUIRED: "true"
      APP_STORAGE_MINIO_ENDPOINT: http://127.0.0.1:8900
      APP_STORAGE_MINIO_PUBLIC_ENDPOINT: https://apptest.indiceapp.com/storage
      APP_STORAGE_MINIO_SERVICE_PUBLIC_ENDPOINT: http://127.0.0.1:8900
      APP_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      APP_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      APP_STORAGE_MINIO_BUCKET_ATTENDANCE: ${MINIO_BUCKET_ATTENDANCE:-indice-hr-attendance}
      APP_STORAGE_MINIO_BUCKET_BIOMETRIC: ${MINIO_BUCKET_BIOMETRIC:-indice-hr-biometric}
      APP_STORAGE_MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-indice-hr-documents}
      APP_STORAGE_MINIO_BUCKET_SALES_DOCUMENTS: ${MINIO_BUCKET_SALES_DOCUMENTS:-indice-sales-documents}
      APP_HR_FACE_ENABLED: "false"
      APP_HR_KIOSK_IDENTIFICATION_TOKEN_SECRET: ${APP_HR_KIOSK_IDENTIFICATION_TOKEN_SECRET:?APP_HR_KIOSK_IDENTIFICATION_TOKEN_SECRET is required}
      APP_KIOSK_TOKEN_PROTECTION_SECRET: ${APP_KIOSK_TOKEN_PROTECTION_SECRET:?APP_KIOSK_TOKEN_PROTECTION_SECRET is required}
      KIOSK_ENGINE_ADAPTER_PETTY_CASH_ENABLED: ${KIOSK_ENGINE_ADAPTER_PETTY_CASH_ENABLED:-false}
      APP_EMAIL_ENABLED: "false"
      APP_ENTITLEMENTS_SHADOW_ENABLED: "true"
      APP_ENTITLEMENTS_PROJECTION_ENABLED: "true"
      APP_ENTITLEMENTS_ENFORCEMENT_ENABLED: "false"
      APP_BILLING_STRIPE_ENABLED: ${APP_BILLING_STRIPE_ENABLED:-true}
      APP_BILLING_STRIPE_MODE: ${APP_BILLING_STRIPE_MODE:-test}
      APP_BILLING_STRIPE_SECRET_KEY: ${APP_BILLING_STRIPE_SECRET_KEY:?APP_BILLING_STRIPE_SECRET_KEY is required}
      APP_BILLING_STRIPE_WEBHOOK_SECRET: ${APP_BILLING_STRIPE_WEBHOOK_SECRET:-}
      APP_BILLING_STRIPE_SUCCESS_URL: https://apptest.indiceapp.com/signup/complete?session_id={CHECKOUT_SESSION_ID}
      APP_BILLING_STRIPE_CANCEL_URL: https://apptest.indiceapp.com/signup
      APP_BILLING_STRIPE_PORTAL_RETURN_URL: https://apptest.indiceapp.com/home-panel/billing
      APP_BILLING_STRIPE_AUTOMATIC_TAX_ENABLED: "true"
      APP_BILLING_STRIPE_TAX_ID_COLLECTION_ENABLED: "true"
      APP_BILLING_STRIPE_CATALOG_LIVE_SYNC_ENABLED: ${APP_BILLING_STRIPE_CATALOG_LIVE_SYNC_ENABLED:-false}
      APP_BILLING_STRIPE_PRICE_BASIC_1_MONTHLY: ${APP_BILLING_STRIPE_PRICE_BASIC_1_MONTHLY:?monthly price is required}
      APP_BILLING_STRIPE_PRICE_BASIC_1_ANNUAL: ${APP_BILLING_STRIPE_PRICE_BASIC_1_ANNUAL:?annual price is required}
      APP_BILLING_STRIPE_PRICE_BASIC_2_MONTHLY: ${APP_BILLING_STRIPE_PRICE_BASIC_2_MONTHLY:?monthly price is required}
      APP_BILLING_STRIPE_PRICE_BASIC_2_ANNUAL: ${APP_BILLING_STRIPE_PRICE_BASIC_2_ANNUAL:?annual price is required}
      APP_BILLING_STRIPE_PRICE_BASIC_3_MONTHLY: ${APP_BILLING_STRIPE_PRICE_BASIC_3_MONTHLY:?monthly price is required}
      APP_BILLING_STRIPE_PRICE_BASIC_3_ANNUAL: ${APP_BILLING_STRIPE_PRICE_BASIC_3_ANNUAL:?annual price is required}
      APP_BILLING_STRIPE_PRICE_BASIC_ALL_MONTHLY: ${APP_BILLING_STRIPE_PRICE_BASIC_ALL_MONTHLY:?monthly price is required}
      APP_BILLING_STRIPE_PRICE_BASIC_ALL_ANNUAL: ${APP_BILLING_STRIPE_PRICE_BASIC_ALL_ANNUAL:?annual price is required}
      APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_MONTHLY: ${APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_MONTHLY:?monthly price is required}
      APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_ANNUAL: ${APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_ANNUAL:?annual price is required}
      APP_BILLING_STRIPE_PRICE_STORAGE_BLOCK_MONTHLY: ${APP_BILLING_STRIPE_PRICE_STORAGE_BLOCK_MONTHLY:-}
      APP_BILLING_STRIPE_PRICE_STORAGE_BLOCK_ANNUAL: ${APP_BILLING_STRIPE_PRICE_STORAGE_BLOCK_ANNUAL:-}
      APP_BILLING_STRIPE_PROCESSOR_ENABLED: ${APP_BILLING_STRIPE_PROCESSOR_ENABLED:-false}
      APP_BILLING_PROVISIONING_ENABLED: ${APP_BILLING_PROVISIONING_ENABLED:-false}
      APP_BILLING_LIFECYCLE_ENABLED: ${APP_BILLING_LIFECYCLE_ENABLED:-true}
      APP_BILLING_LIFECYCLE_SCHEDULER_ENABLED: ${APP_BILLING_LIFECYCLE_SCHEDULER_ENABLED:-true}
      APP_BILLING_LIFECYCLE_GRACE_DAYS: 14
      APP_BILLING_LIFECYCLE_READ_ONLY_DAYS: 14
      APP_BILLING_LIFECYCLE_RETENTION_DAYS: 90
      APP_BILLING_STORAGE_ENFORCEMENT_ENABLED: ${APP_BILLING_STORAGE_ENFORCEMENT_ENABLED:-false}
      APP_BILLING_STORAGE_INCLUDED_BYTES: 5368709120
      APP_BILLING_STORAGE_BLOCK_BYTES: 5368709120
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xms256m -Xmx768m}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8182/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  web:
    image: indice-erp-web:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    network_mode: host
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8180/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  minio-data:
