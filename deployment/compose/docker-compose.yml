name: indice-erp

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    command:
      - --character-set-server=${MYSQL_CHARACTER_SET:-utf8mb4}
      - --collation-server=${MYSQL_COLLATION:-utf8mb4_0900_ai_ci}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-indice_db}
      MYSQL_USER: ${MYSQL_USER:-indice_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-indice_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - 127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000
    volumes:
      - minio-data:/data

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_ATTENDANCE: ${MINIO_BUCKET_ATTENDANCE:-indice-hr-attendance}
      MINIO_BUCKET_BIOMETRIC: ${MINIO_BUCKET_BIOMETRIC:-indice-hr-biometric}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-indice-hr-documents}
      MINIO_BUCKET_SALES_DOCUMENTS: ${MINIO_BUCKET_SALES_DOCUMENTS:-indice-sales-documents}
      MINIO_CORS_FILE: /init/attendance-cors.xml
    volumes:
      - ../docker/minio/init-minio.sh:/init/init-minio.sh:ro
      - ../../ops/minio/attendance-cors.xml:/init/attendance-cors.xml:ro
    entrypoint:
      - /bin/sh
      - /init/init-minio.sh

  face-service:
    build:
      context: ../..
      dockerfile: services/face_verification/Dockerfile
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://127.0.0.1:8091/internal/health >/dev/null || exit 1
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      face-service:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8082}
      SERVER_ADDRESS: ${SERVER_ADDRESS:-0.0.0.0}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-indice_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=utf8}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MYSQL_USER:-indice_user}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD:-indice_pass}}
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER:-minio}
      APP_STORAGE_REQUIRED: ${APP_STORAGE_REQUIRED:-true}
      APP_STORAGE_MINIO_ENDPOINT: ${APP_STORAGE_MINIO_ENDPOINT:-http://minio:9000}
      APP_STORAGE_MINIO_PUBLIC_ENDPOINT: ${APP_STORAGE_MINIO_PUBLIC_ENDPOINT:-${MINIO_PUBLIC_ENDPOINT:-http://localhost:8080/storage}}
      APP_STORAGE_MINIO_SERVICE_PUBLIC_ENDPOINT: ${APP_STORAGE_MINIO_SERVICE_PUBLIC_ENDPOINT:-${APP_STORAGE_MINIO_PUBLIC_ENDPOINT:-${MINIO_PUBLIC_ENDPOINT:-http://localhost:8080/storage}}}
      APP_STORAGE_MINIO_ACCESS_KEY: ${APP_STORAGE_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      APP_STORAGE_MINIO_SECRET_KEY: ${APP_STORAGE_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      APP_STORAGE_MINIO_REGION: ${APP_STORAGE_MINIO_REGION:-${MINIO_REGION:-us-east-1}}
      APP_STORAGE_MINIO_BUCKET_ATTENDANCE: ${MINIO_BUCKET_ATTENDANCE:-indice-hr-attendance}
      APP_STORAGE_MINIO_BUCKET_BIOMETRIC: ${MINIO_BUCKET_BIOMETRIC:-indice-hr-biometric}
      APP_STORAGE_MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-indice-hr-documents}
      APP_STORAGE_MINIO_BUCKET_SALES_DOCUMENTS: ${MINIO_BUCKET_SALES_DOCUMENTS:-indice-sales-documents}
      APP_STORAGE_MINIO_PRESIGN_EXPIRY_SECONDS: ${APP_STORAGE_MINIO_PRESIGN_EXPIRY_SECONDS:-${MINIO_PRESIGN_EXPIRY_SECONDS:-900}}
      APP_WEB_ALLOWED_ORIGINS: ${APP_WEB_ALLOWED_ORIGINS:-http://localhost:8080}
      APP_WEB_PUBLIC_URL: ${APP_WEB_PUBLIC_URL:-${WEB_PUBLIC_URL:-${APP_WEB_BASE_URL:-http://localhost:8080}}}
      APP_WEB_INVITATION_BASE_URL: ${APP_WEB_INVITATION_BASE_URL:-${APP_WEB_PUBLIC_URL:-${WEB_PUBLIC_URL:-${APP_WEB_BASE_URL:-http://localhost:8080}}}}
      APP_AI_OAUTH_ISSUER_URL: ${APP_AI_OAUTH_ISSUER_URL:-${APP_WEB_PUBLIC_URL:-http://localhost:8080}}
      APP_AI_OAUTH_RESOURCE_URL: ${APP_AI_OAUTH_RESOURCE_URL:-http://localhost:3010/mcp}
      APP_AI_PUBLICATION_DOMAIN_CHALLENGE_TOKEN: ${APP_AI_PUBLICATION_DOMAIN_CHALLENGE_TOKEN:-}
      APP_PRODUCT_ANALYTICS_WEB_INGEST_TOKEN: ${APP_PRODUCT_ANALYTICS_WEB_INGEST_TOKEN:-}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-false}
      APP_SESSION_COOKIE_SAME_SITE: ${APP_SESSION_COOKIE_SAME_SITE:-lax}
      APP_SESSION_TIMEOUT: ${APP_SESSION_TIMEOUT:-12h}
      APP_AUTH_MFA_REQUIRED: ${APP_AUTH_MFA_REQUIRED:-true}
      APP_BILLING_STRIPE_ENABLED: ${APP_BILLING_STRIPE_ENABLED:-false}
      APP_BILLING_STRIPE_MODE: ${APP_BILLING_STRIPE_MODE:-test}
      APP_BILLING_STRIPE_SECRET_KEY: ${APP_BILLING_STRIPE_SECRET_KEY:-}
      APP_BILLING_STRIPE_SECRET_KEY_FILE: ${APP_BILLING_STRIPE_SECRET_KEY_FILE:-}
      APP_BILLING_STRIPE_WEBHOOK_SECRET: ${APP_BILLING_STRIPE_WEBHOOK_SECRET:-}
      APP_BILLING_STRIPE_WEBHOOK_SECRET_FILE: ${APP_BILLING_STRIPE_WEBHOOK_SECRET_FILE:-}
      APP_BILLING_STRIPE_SUCCESS_URL: ${APP_BILLING_STRIPE_SUCCESS_URL:-}
      APP_BILLING_STRIPE_CANCEL_URL: ${APP_BILLING_STRIPE_CANCEL_URL:-}
      APP_BILLING_STRIPE_PORTAL_RETURN_URL: ${APP_BILLING_STRIPE_PORTAL_RETURN_URL:-}
      APP_BILLING_STRIPE_AUTOMATIC_TAX_ENABLED: ${APP_BILLING_STRIPE_AUTOMATIC_TAX_ENABLED:-true}
      APP_BILLING_STRIPE_TAX_ID_COLLECTION_ENABLED: ${APP_BILLING_STRIPE_TAX_ID_COLLECTION_ENABLED:-true}
      APP_BILLING_STRIPE_CATALOG_LIVE_SYNC_ENABLED: ${APP_BILLING_STRIPE_CATALOG_LIVE_SYNC_ENABLED:-false}
      APP_BILLING_STRIPE_PRICE_BASIC_1_MONTHLY: ${APP_BILLING_STRIPE_PRICE_BASIC_1_MONTHLY:-}
      APP_BILLING_STRIPE_PRICE_BASIC_1_ANNUAL: ${APP_BILLING_STRIPE_PRICE_BASIC_1_ANNUAL:-}
      APP_BILLING_STRIPE_PRICE_BASIC_2_MONTHLY: ${APP_BILLING_STRIPE_PRICE_BASIC_2_MONTHLY:-}
      APP_BILLING_STRIPE_PRICE_BASIC_2_ANNUAL: ${APP_BILLING_STRIPE_PRICE_BASIC_2_ANNUAL:-}
      APP_BILLING_STRIPE_PRICE_BASIC_3_MONTHLY: ${APP_BILLING_STRIPE_PRICE_BASIC_3_MONTHLY:-}
      APP_BILLING_STRIPE_PRICE_BASIC_3_ANNUAL: ${APP_BILLING_STRIPE_PRICE_BASIC_3_ANNUAL:-}
      APP_BILLING_STRIPE_PRICE_BASIC_ALL_MONTHLY: ${APP_BILLING_STRIPE_PRICE_BASIC_ALL_MONTHLY:-}
      APP_BILLING_STRIPE_PRICE_BASIC_ALL_ANNUAL: ${APP_BILLING_STRIPE_PRICE_BASIC_ALL_ANNUAL:-}
      APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_MONTHLY: ${APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_MONTHLY:-}
      APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_ANNUAL: ${APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_ANNUAL:-}
      APP_BILLING_STRIPE_PRICE_STORAGE_BLOCK_MONTHLY: ${APP_BILLING_STRIPE_PRICE_STORAGE_BLOCK_MONTHLY:-}
      APP_BILLING_STRIPE_PRICE_STORAGE_BLOCK_ANNUAL: ${APP_BILLING_STRIPE_PRICE_STORAGE_BLOCK_ANNUAL:-}
      APP_BILLING_STRIPE_PROCESSOR_ENABLED: ${APP_BILLING_STRIPE_PROCESSOR_ENABLED:-false}
      APP_BILLING_PROVISIONING_ENABLED: ${APP_BILLING_PROVISIONING_ENABLED:-false}
      APP_BILLING_PROVISIONING_RECONCILIATION_BATCH_SIZE: ${APP_BILLING_PROVISIONING_RECONCILIATION_BATCH_SIZE:-25}
      APP_BILLING_LIFECYCLE_ENABLED: ${APP_BILLING_LIFECYCLE_ENABLED:-false}
      APP_BILLING_LIFECYCLE_SCHEDULER_ENABLED: ${APP_BILLING_LIFECYCLE_SCHEDULER_ENABLED:-false}
      APP_BILLING_LIFECYCLE_GRACE_DAYS: ${APP_BILLING_LIFECYCLE_GRACE_DAYS:-14}
      APP_BILLING_LIFECYCLE_READ_ONLY_DAYS: ${APP_BILLING_LIFECYCLE_READ_ONLY_DAYS:-14}
      APP_BILLING_LIFECYCLE_RETENTION_DAYS: ${APP_BILLING_LIFECYCLE_RETENTION_DAYS:-90}
      APP_BILLING_LIFECYCLE_SCHEDULER_DELAY_MS: ${APP_BILLING_LIFECYCLE_SCHEDULER_DELAY_MS:-60000}
      APP_BILLING_LIFECYCLE_SCHEDULER_BATCH_SIZE: ${APP_BILLING_LIFECYCLE_SCHEDULER_BATCH_SIZE:-100}
      APP_BILLING_STORAGE_ENFORCEMENT_ENABLED: ${APP_BILLING_STORAGE_ENFORCEMENT_ENABLED:-true}
      APP_BILLING_STORAGE_INCLUDED_BYTES: ${APP_BILLING_STORAGE_INCLUDED_BYTES:-107374182400}
      APP_BILLING_STORAGE_BLOCK_BYTES: ${APP_BILLING_STORAGE_BLOCK_BYTES:-107374182400}
      APP_BILLING_STORAGE_RESERVATION_TTL_MINUTES: ${APP_BILLING_STORAGE_RESERVATION_TTL_MINUTES:-30}
      APP_BILLING_STORAGE_CLEANUP_BATCH_SIZE: ${APP_BILLING_STORAGE_CLEANUP_BATCH_SIZE:-200}
      APP_BILLING_STORAGE_CLEANUP_DELAY_MS: ${APP_BILLING_STORAGE_CLEANUP_DELAY_MS:-300000}
      APP_BILLING_STORAGE_OVERAGE_SYNC_DELAY_MS: ${APP_BILLING_STORAGE_OVERAGE_SYNC_DELAY_MS:-60000}
      APP_HR_ATTENDANCE_ENFORCE_LOCATION_RADIUS: ${APP_HR_ATTENDANCE_ENFORCE_LOCATION_RADIUS:-false}
      APP_HR_FACE_ENABLED: ${APP_HR_FACE_ENABLED:-true}
      APP_HR_FACE_SERVICE_BASE_URL: ${APP_HR_FACE_SERVICE_BASE_URL:-http://face-service:8091}
      APP_HR_FACE_SESSION_EXPIRY_SECONDS: ${APP_HR_FACE_SESSION_EXPIRY_SECONDS:-600}
      APP_HR_KIOSK_IDENTIFICATION_TOKEN_SECRET: ${APP_HR_KIOSK_IDENTIFICATION_TOKEN_SECRET:?APP_HR_KIOSK_IDENTIFICATION_TOKEN_SECRET must be set}
      APP_HR_KIOSK_IDENTIFICATION_TOKEN_TTL_SECONDS: ${APP_HR_KIOSK_IDENTIFICATION_TOKEN_TTL_SECONDS:-180}
      APP_HR_KIOSK_INACTIVITY_TIMEOUT_SECONDS: ${APP_HR_KIOSK_INACTIVITY_TIMEOUT_SECONDS:-180}
      APP_EXPENSES_KIOSK_INACTIVITY_TIMEOUT_SECONDS: ${APP_EXPENSES_KIOSK_INACTIVITY_TIMEOUT_SECONDS:-300}
      APP_EXPENSES_KIOSK_SESSION_TTL_SECONDS: ${APP_EXPENSES_KIOSK_SESSION_TTL_SECONDS:-28800}
      APP_PETTY_CASH_KIOSK_INACTIVITY_TIMEOUT_SECONDS: ${APP_PETTY_CASH_KIOSK_INACTIVITY_TIMEOUT_SECONDS:-900}
      APP_PETTY_CASH_KIOSK_SESSION_TTL_SECONDS: ${APP_PETTY_CASH_KIOSK_SESSION_TTL_SECONDS:-14400}
      APP_PROCESS_TASKS_KIOSK_INACTIVITY_TIMEOUT_SECONDS: ${APP_PROCESS_TASKS_KIOSK_INACTIVITY_TIMEOUT_SECONDS:-1800}
      APP_PROCESS_TASKS_KIOSK_SESSION_TTL_SECONDS: ${APP_PROCESS_TASKS_KIOSK_SESSION_TTL_SECONDS:-28800}
      APP_KIOSK_TOKEN_PROTECTION_SECRET: ${APP_KIOSK_TOKEN_PROTECTION_SECRET:?APP_KIOSK_TOKEN_PROTECTION_SECRET must be set}
      KIOSK_ENGINE_ADAPTER_PETTY_CASH_ENABLED: ${KIOSK_ENGINE_ADAPTER_PETTY_CASH_ENABLED:-false}
      KIOSK_GLOBAL_CENTER_ENABLED: ${KIOSK_GLOBAL_CENTER_ENABLED:-false}
      KIOSK_MULTI_DASHBOARD_ENABLED: ${KIOSK_MULTI_DASHBOARD_ENABLED:-false}
      KIOSK_EMPLOYEE_CENTER_ENABLED: ${KIOSK_EMPLOYEE_CENTER_ENABLED:-false}
      KIOSK_EMPLOYEE_CENTER_INACTIVITY_TIMEOUT_SECONDS: ${KIOSK_EMPLOYEE_CENTER_INACTIVITY_TIMEOUT_SECONDS:-28800}
      KIOSK_MULTI_INACTIVITY_TIMEOUT_SECONDS: ${KIOSK_MULTI_INACTIVITY_TIMEOUT_SECONDS:-28800}
      KIOSK_MULTI_SESSION_TTL_SECONDS: ${KIOSK_MULTI_SESSION_TTL_SECONDS:-43200}
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-true}
      APP_EMAIL_PROVIDER: ${APP_EMAIL_PROVIDER:-sendgrid}
      APP_EMAIL_FROM: ${APP_EMAIL_FROM:-${APP_EMAIL_FROM_ADDRESS:-contacto@indiceapp.com}}
      APP_EMAIL_FROM_ADDRESS: ${APP_EMAIL_FROM_ADDRESS:-contacto@indiceapp.com}
      APP_EMAIL_FROM_NAME: ${APP_EMAIL_FROM_NAME:-Indice}
      APP_EMAIL_REPLY_TO: ${APP_EMAIL_REPLY_TO:-}
      APP_EMAIL_SENDGRID_API_KEY: ${APP_EMAIL_SENDGRID_API_KEY:-}
      APP_CONSULTING_TEAM_EMAIL: ${APP_CONSULTING_TEAM_EMAIL:-consultoria@indiceapp.com}
      APP_CONSULTING_ADDITIONAL_SESSION_AMOUNT_CENTS: ${APP_CONSULTING_ADDITIONAL_SESSION_AMOUNT_CENTS:-7900}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true ${BACKEND_JAVA_OPTS:--Xms256m -Xmx768m}"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://127.0.0.1:$${SERVER_PORT:-8082}/api/v1/health" || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  web:
    build:
      context: ../..
      dockerfile: deployment/docker/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - ${WEB_HOST_PORT:-8080}:8080
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql-data:
  minio-data:
