resolver 127.0.0.11 ipv6=off valid=30s;

# Never persist public kiosk credentials in access logs. This format deliberately
# excludes query strings, referrers and cookies; the map also masks path tokens.
map $uri $indice_safe_uri {
    default $uri;
    ~^/api/v2/kiosks/public/                         /api/v2/kiosks/public/[redacted];
    ~^/api/v1/hr/attendance/public-kiosk/            /api/v1/hr/attendance/public-kiosk/[redacted];
    ~^/api/v1/process-tasks/public-kiosk/             /api/v1/process-tasks/public-kiosk/[redacted];
    ~^/api/v1/finance/petty-cash/public-kiosk/        /api/v1/finance/petty-cash/public-kiosk/[redacted];
    ~^/api/v1/finance/public-payable-kiosks/          /api/v1/finance/public-payable-kiosks/[redacted];
    ~^/api/v1/pos/public/supplier-portal/             /api/v1/pos/public/supplier-portal/[redacted];
    ~^/api/v1/pos/customer-displays/public/           /api/v1/pos/customer-displays/public/[redacted];
    ~^/kiosk/                                         /kiosk/[redacted];
    ~^/task-kiosk/                                    /task-kiosk/[redacted];
    ~^/petty-cash/kiosk/                              /petty-cash/kiosk/[redacted];
    ~^/expenses/kiosk/cuentas-por-pagar/              /expenses/kiosk/cuentas-por-pagar/[redacted];
    ~^/public-catalog/                                 /public-catalog/[redacted];
    ~^/pos-display/                                    /pos-display/[redacted];
    ~^/supplier-portal/                                /supplier-portal/[redacted];
    ~^/pos-self-service/                               /pos-self-service/[redacted];
}

log_format indice_safe '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $indice_safe_uri $server_protocol" '
                       '$status $body_bytes_sent';

server {
    listen 8080;
    server_name _;

    # Server scope overrides the image's inherited `main` logger instead of
    # adding a second (unsafe) access log alongside it.
    access_log /var/log/nginx/access.log indice_safe;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 25m;
    add_header Referrer-Policy "no-referrer" always;

    set $backend_upstream http://backend:8082;
    set $mcp_upstream http://mcp:3010;

    location ~ ^/\.well-known/(oauth-protected-resource|oauth-authorization-server|openai-apps-challenge)$ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Public, OAuth-protected MCP entrypoint used by the OpenAI plugin directory.
    # Runtime DNS resolution keeps the web container healthy when the optional
    # MCP profile is disabled; requests fail closed until MCP is enabled.
    location = /api/v1/ai/mcp {
        proxy_pass $mcp_upstream/mcp;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Discard a caller-supplied chain. The backend uses this proxy-owned address
        # as the stable network boundary for public-kiosk throttling.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
    }

    location = /stale-chunk-reload.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /stale-chunk-reload.js =404;
    }

    location ~ ^/assets/.+\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "no-referrer" always;
        error_page 404 =200 /stale-chunk-reload.js;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
