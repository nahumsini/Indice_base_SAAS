name: Deploy

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Run CI before deploy
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - checks
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH || 'deploy' }}
      DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE || '' }}
      DEPLOY_MODE: ${{ secrets.DEPLOY_MODE || 'compose' }}
      DEPLOY_PUBLIC_URL: ${{ secrets.DEPLOY_PUBLIC_URL || '' }}
    steps:
      - name: Validate deployment secrets
        run: |
          missing=0
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required GitHub secret: ${key}"
              missing=1
            fi
          done
          if [[ "${DEPLOY_MODE}" != "compose" && "${DEPLOY_MODE}" != "host-network" ]]; then
            echo "::error::DEPLOY_MODE must be compose or host-network."
            missing=1
          fi
          exit "${missing}"

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/indice_deploy_key
          chmod 600 ~/.ssh/indice_deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy checked commit on server
        run: |
          remote_cmd="DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}")"
          remote_cmd+=" DEPLOY_BRANCH=$(printf '%q' "${DEPLOY_BRANCH}")"
          remote_cmd+=" DEPLOY_ENV_FILE=$(printf '%q' "${DEPLOY_ENV_FILE}")"
          remote_cmd+=" DEPLOY_MODE=$(printf '%q' "${DEPLOY_MODE}")"
          remote_cmd+=" DEPLOY_PUBLIC_URL=$(printf '%q' "${DEPLOY_PUBLIC_URL}")"
          remote_cmd+=" bash -s"

          ssh -i ~/.ssh/indice_deploy_key \
            -p "${DEPLOY_PORT}" \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${remote_cmd}" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_PATH}"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Server checkout has uncommitted changes. Refusing to deploy."
            exit 1
          fi

          git fetch origin "${DEPLOY_BRANCH}"
          if [[ "$(git branch --show-current)" != "${DEPLOY_BRANCH}" ]]; then
            git checkout "${DEPLOY_BRANCH}"
          fi
          git pull --ff-only origin "${DEPLOY_BRANCH}"

          env_file_args=()
          if [[ -n "${DEPLOY_ENV_FILE}" ]]; then
            if [[ ! -f "${DEPLOY_ENV_FILE}" ]]; then
              echo "Missing DEPLOY_ENV_FILE on server: ${DEPLOY_ENV_FILE}" >&2
              exit 1
            fi
            env_file_args=(DEPLOY_ENV_FILE="${DEPLOY_ENV_FILE}")
          fi

          bash -n deployment/scripts/*.sh scripts/*.sh

          if [[ "${DEPLOY_MODE}" == "host-network" ]]; then
            docker build -f deployment/docker/backend/Dockerfile -t "${BACKEND_IMAGE:-indice-erp-backend:latest}" .
            docker build -f deployment/docker/web/Dockerfile -t "${WEB_IMAGE:-indice-erp-web:latest}" .
            env \
              APP_DIR="${DEPLOY_PATH}" \
              PUBLIC_URL="${DEPLOY_PUBLIC_URL}" \
              "${env_file_args[@]}" \
              ./deployment/scripts/up-host-network.sh
          else
            env "${env_file_args[@]}" ./deployment/scripts/up.sh
            env "${env_file_args[@]}" ./deployment/scripts/smoke-test.sh
          fi
          REMOTE
