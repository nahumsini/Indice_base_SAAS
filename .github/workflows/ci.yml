name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-checks:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: indice_test_db
          MYSQL_USER: indice_test_user
          MYSQL_PASSWORD: indice_test_pass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
    env:
      TEST_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/indice_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      TEST_DATASOURCE_USERNAME: indice_test_user
      TEST_DATASOURCE_PASSWORD: indice_test_pass
      APP_IMAGE_TAG: ci
      MYSQL_DATABASE: indice_ci
      MYSQL_USER: indice_ci
      MYSQL_PASSWORD: indice_ci_password
      MYSQL_ROOT_PASSWORD: indice_ci_root_password
      MINIO_ROOT_USER: indiceci
      MINIO_ROOT_PASSWORD: indice_ci_minio_password
      APP_HR_KIOSK_IDENTIFICATION_TOKEN_SECRET: indice-ci-hr-kiosk-identification-secret
      APP_KIOSK_TOKEN_PROTECTION_SECRET: indice-ci-kiosk-token-protection-secret
      APP_BILLING_STRIPE_SECRET_KEY: sk_test_ci_placeholder
      APP_BILLING_STRIPE_PRICE_BASIC_1_MONTHLY: price_ci_basic_1_monthly
      APP_BILLING_STRIPE_PRICE_BASIC_1_ANNUAL: price_ci_basic_1_annual
      APP_BILLING_STRIPE_PRICE_BASIC_2_MONTHLY: price_ci_basic_2_monthly
      APP_BILLING_STRIPE_PRICE_BASIC_2_ANNUAL: price_ci_basic_2_annual
      APP_BILLING_STRIPE_PRICE_BASIC_3_MONTHLY: price_ci_basic_3_monthly
      APP_BILLING_STRIPE_PRICE_BASIC_3_ANNUAL: price_ci_basic_3_annual
      APP_BILLING_STRIPE_PRICE_BASIC_ALL_MONTHLY: price_ci_basic_all_monthly
      APP_BILLING_STRIPE_PRICE_BASIC_ALL_ANNUAL: price_ci_basic_all_annual
      APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_MONTHLY: price_ci_extra_seat_monthly
      APP_BILLING_STRIPE_PRICE_EXTRA_SEAT_ANNUAL: price_ci_extra_seat_annual
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Validate Flyway migration numbering and startup migrations
        run: ./mvnw -B -ntp clean -Dtest=MigrationVersionUniquenessTest,IndiceErpApiApplicationTests test

      - name: Run backend test suite
        run: ./mvnw -B -ntp test

      - name: Install frontend dependencies
        working-directory: react
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: react
        run: npm run typecheck

      - name: Build frontend
        working-directory: react
        run: npm run build

      - name: Run frontend regression tests
        working-directory: react
        run: |
          npm run test:auth
          npm run test:dashboard-ui
          npm run test:human-resources-ui
          npm run test:kiosks
          npm run test:expenses
          npm run test:expenses-ui
          npm run test:budgets
          npm run test:petty-cash-ui
          npm run test:finance-bulk
          npm run test:receivables-ui
          npm run test:processes-tasks-ui
          npm run test:invitation
          npm run test:learning-mode
          npm run test:users
          npm run test:kpis-ui
          npm run test:inventory-ui
          npm run test:sales-ui
          npm run test:sales-workflow
          npm run test:pos-ui
          npm run test:platform-admin
          npm run test:billing-flow
          npm run test:distributor-portal
          npm run test:print
          npm run test:phone-validation
          node --experimental-strip-types --test tests/commission-runtime.test.mjs tests/kpi-financial-flows-regression.test.mjs tests/task-kiosk-filter-runtime.test.mjs tests/training-workspace-regression.test.mjs
          node --test tests/internal-development-regression.test.mjs tests/system-tickets-print-regression.test.mjs

      - name: Validate shell scripts
        run: bash -n deployment/scripts/*.sh scripts/*.sh

      - name: Validate base Compose config
        run: docker compose --env-file deployment/env/.env.example -f deployment/compose/docker-compose.yml config --quiet

      - name: Validate staging Compose config
        run: docker compose --env-file deployment/env/.env.example -f deployment/compose/docker-compose.staging.yml config --quiet

      - name: Build backend image
        run: docker build --network=host -f deployment/docker/backend/Dockerfile -t indice-erp-backend:ci .

      - name: Build isolated MinIO dependency from official source
        run: docker build -f deployment/docker/ci-minio/Dockerfile -t indice-minio-ci:07c3a429bfed .

      - name: Smoke backend image with server runtime settings
        env:
          CI_SMOKE_MINIO_IMAGE: indice-minio-ci:07c3a429bfed
        run: bash scripts/ci-backend-runtime-smoke.sh indice-erp-backend:ci

      - name: Build web image
        run: docker build -f deployment/docker/web/Dockerfile -t indice-erp-web:ci .
